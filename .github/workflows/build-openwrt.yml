name: build-openwrt

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Pinned OpenWrt 24.10.2 mediatek/filogic SDK (must match scripts/build-sdk.sh defaults).
env:
  SDK_URL: https://downloads.openwrt.org/releases/24.10.2/targets/mediatek/filogic/openwrt-sdk-24.10.2-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
  SDK_SHA256: df288284baa46d37cbc71812130b72617333f886f5c93c11f0548e28f0bb8309

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Host unit/integration tests
        run: make test
      - name: ShellCheck
        run: make shellcheck

  sdk-build:
    needs: host-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl zstd \
            time python3

      - name: Build packages with pinned OpenWrt SDK
        run: |
          SDK_URL="${{ env.SDK_URL }}" SDK_SHA256="${{ env.SDK_SHA256 }}" \
            sh scripts/build-sdk.sh dist

      - name: Verify SHA256SUMS
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ipk-bundle
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.ipk
            dist/SHA256SUMS
            dist/LICENSE
            dist/cloudflare-speedtest.version
            dist/CloudflareSpeedTest-*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
